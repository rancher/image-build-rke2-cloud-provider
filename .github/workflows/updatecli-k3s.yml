name: "Updatecli: k3s Sources"

on:
  schedule:
    # Mondays at 18:00 UTC.
    - cron: '0 18 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updatecli-k3s-sources
  cancel-in-progress: false

jobs:
  updatecli:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Load Secrets from Vault
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          secrets: |
            secret/data/github/org/${{ github.repository_owner }}/github/renovate-rancher appId | APP_ID ;
            secret/data/github/org/${{ github.repository_owner }}/github/renovate-rancher privateKey | PRIVATE_KEY

      - name: Generate App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}

      - name: Install Updatecli
        uses: updatecli/updatecli-action@2efa15cbae1751f532f9bfc88f56adafd6d1faed # v3.8.0

      - name: Apply k3s source updates
        run: |
          K3S_VALUES=$(jq -cer '{k3sMinors: keys}' k3s-sources.json)
          updatecli pipeline apply --clean \
            --config ./updatecli/updatecli.d/k3s-sources.yaml \
            --values ./updatecli/values.yaml \
            --values-inline "${K3S_VALUES}"
        env:
          UPDATECLI_GITHUB_ACTOR: "renovate-rancher[bot]"
          UPDATECLI_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
