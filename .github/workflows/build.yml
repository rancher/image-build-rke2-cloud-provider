on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  security-events: write # upload Sarif results

name: Build
jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

    - name: Prepare dependency cache
      run: mkdir -p .cache/modsync

    - name: Remove Unnecessary Tools
      run: |
        sudo rm -rf \
          /home/linuxbrew \
          /home/packer \
          /opt/az \
          /opt/microsoft \
          /usr/lib/firefox \
          /usr/lib/google-cloud-sdk \
          /usr/local/julia* \
          /usr/local/share/boost \
          /usr/local/share/chromium \
          /usr/local/share/powershell \
          /usr/share/az* \
          /usr/share/dotnet \
          /usr/share/miniconda \
          /usr/share/swift
        df -khl

    - name: Build all amd64 images sequentially
      env:
        TARGET_PLATFORMS: linux/amd64
      run: |
        MINORS=$(jq -er 'keys | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | .[]' k3s-sources.json)
        for MINOR in $MINORS; do
          echo "::group::Build ${MINOR} (amd64)"
          make image-build K3S_MINOR="${MINOR}"
          echo "::endgroup::"
        done

  build-arm64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

    - name: Prepare dependency cache
      run: mkdir -p .cache/modsync

    - name: Remove Unnecessary Tools
      run: |
        sudo rm -rf \
          /home/linuxbrew \
          /home/packer \
          /opt/az \
          /opt/microsoft \
          /usr/lib/firefox \
          /usr/lib/google-cloud-sdk \
          /usr/local/julia* \
          /usr/local/share/boost \
          /usr/local/share/chromium \
          /usr/local/share/powershell \
          /usr/share/az* \
          /usr/share/dotnet \
          /usr/share/miniconda \
          /usr/share/swift
        df -khl

    - name: Build all arm64 images sequentially
      env:
        TARGET_PLATFORMS: linux/arm64
      run: |
        MINORS=$(jq -er 'keys | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | .[]' k3s-sources.json)
        for MINOR in $MINORS; do
          echo "::group::Build ${MINOR} (arm64)"
          make image-build K3S_MINOR="${MINOR}"
          echo "::endgroup::"
        done
