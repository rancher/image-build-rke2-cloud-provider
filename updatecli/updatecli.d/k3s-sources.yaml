---
name: "Update k3s source commits"

sources:
{{ range $minor := .k3sMinors }}
  k3s-{{ $minor }}:
    name: "Latest commit on k3s release-{{ trimPrefix "v" $minor }}"
    kind: gitcommit
    spec:
      url: https://github.com/k3s-io/k3s.git
      branch: release-{{ trimPrefix "v" $minor }}
      depth: 1
{{ end }}

targets:
{{ range $minor := .k3sMinors }}
  k3s-{{ $minor }}:
    name: "Update {{ $minor }} source commit"
    kind: json
    scmid: default
    sourceid: k3s-{{ $minor }}
    spec:
      file: k3s-sources.json
      engine: dasel/v3
      key: '["{{ $minor }}"]'
{{ end }}

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'

actions:
  default:
    title: "Update k3s source commits"
    kind: github/pullrequest
    scmid: default
    spec:
      merge:
        strategy: manual
      labels:
        - updatecli
        - status/auto-created
